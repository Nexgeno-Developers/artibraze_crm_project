name: Deploy to cPanel Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to cPanel via SSH
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Deploy Code to Production
        env:
          SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
          SSH_PORT: ${{ secrets.CPANEL_SSH_PORT || 22 }}
          SSH_USER: ${{ secrets.CPANEL_SSH_USER }}
          SSH_KEY: ${{ secrets.CPANEL_SSH_KEY }}
          SSH_PASSPHRASE: ${{ secrets.CPANEL_SSH_PASSPHRASE || '' }}
          REPO_PATH: ${{ secrets.CPANEL_REPO_PATH || '/home2/arfashionnexgeno/repositories/artibraze_crm_project' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Save private key cleanly without CRLF issues
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          # Strip the passphrase if one was set (supports RSA, ED25519, ECDSA)
          if [ -n "$SSH_PASSPHRASE" ]; then
            ssh-keygen -p -P "$SSH_PASSPHRASE" -N "" -f ~/.ssh/id_rsa >/dev/null 2>&1 || true
          fi

          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/id_rsa

          echo "=========================================="
          echo "🚀 Connecting to cPanel Production via SSH"
          echo "=========================================="
          echo "Connecting as: $SSH_USER @ $SSH_HOST on port $SSH_PORT"

          # 1. Update the cPanel Git clone (~/repositories/...) to the latest main
          # 2. Run cicd/deploy.sh: rsync into public_html (same as cPanel "Deploy HEAD Commit")
          ssh \
              -o PreferredAuthentications=publickey \
              -T -o StrictHostKeyChecking=no \
              -o KexAlgorithms=+diffie-hellman-group-exchange-sha256,diffie-hellman-group14-sha256 \
              -o HostKeyAlgorithms=+ssh-ed25519,ssh-rsa,rsa-sha2-512,rsa-sha2-256 \
              -o PubkeyAcceptedAlgorithms=+ssh-ed25519,ssh-rsa,rsa-sha2-512,rsa-sha2-256 \
              -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" << EOF
            set -e
            echo "📁 Entering cPanel repository clone: $REPO_PATH"
            cd "$REPO_PATH"

            git config --global --add safe.directory "$REPO_PATH"
            git config --global core.preloadIndex false
            git config --global checkout.workers 1
            git config --global pack.threads 1

            git remote set-url origin https://github.com/$REPO.git

            echo "🔄 Fetching latest main from GitHub..."
            git fetch "https://x-access-token:${GH_TOKEN}@github.com/$REPO.git" +main:refs/remotes/origin/main
            git checkout -f main 2>/dev/null || git checkout -f -B main origin/main
            git reset --hard origin/main

            echo "⬇️ Deploying into public_html..."
            /bin/bash cicd/deploy.sh

            echo "=========================================="
            echo "✅ Deployment Successful!"
            echo "📌 Deployed Commit: \$(git log -1 --oneline)"
            echo "=========================================="
          EOF
